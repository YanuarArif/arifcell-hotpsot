<!DOCTYPE html>
<html>
<head>
<title id="title"></title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta http-equiv="refresh" content="3;url=$(link-redirect)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #0ea5e9;
    --sky-dark: #0284c7;
    --navy: #0c1a2e;
    --navy-card: #1a2f4a;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --text: #e0f2fe;
    --muted: #7db8d4;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--navy);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(14,165,233,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(56,189,248,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .advert-card {
    background: var(--navy-card);
    border-radius: var(--radius);
    padding: 40px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .advert-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .advert-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
  }

  .advert-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .advert-countdown {
    font-size: 13px;
    color: var(--sky);
    font-weight: 600;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(125,184,212,0.4);
    padding-bottom: 4px;
    margin-top: 16px;
  }

  .footer strong {
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="advert-card">
    <div class="advert-icon">📢</div>
    <div class="advert-title">Selamat Datang</div>
    <div class="advert-text">
      Anda akan dialihkan ke halaman yang diminta.<br>
      Tunggu sebentar...
    </div>
    <div class="advert-countdown">
      Mengalihkan dalam <span id="countdown">3</span> detik...
    </div>
  </div>

  <div class="footer">
    Template by <strong>Yanuar Lukman Arif</strong> &bull; 7 Mei 2026
  </div>
</div>

<script type="text/javascript">
  document.getElementById('title').innerHTML = window.location.hostname + " > redirect";
  
  var countdown = 3;
  var timer = setInterval(function() {
    countdown--;
    document.getElementById('countdown').innerHTML = countdown;
    if (countdown <= 0) {
      clearInterval(timer);
    }
  }, 1000);
</script>
</body>
</html>
