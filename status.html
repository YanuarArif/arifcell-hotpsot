<!DOCTYPE html>
<html>
<head>
<title id="title"></title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #0ea5e9;
    --sky-dark: #0284c7;
    --sky-light: #bae6fd;
    --navy: #0c1a2e;
    --navy-card: #1a2f4a;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --green: #4ade80;
    --red: #ef4444;
    --text: #e0f2fe;
    --muted: #7db8d4;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--navy);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(14,165,233,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(56,189,248,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-status {
    background: var(--navy-card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
  }

  .status-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .status-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--green) 0%, #22c55e 100%);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  .status-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .status-subtitle {
    font-size: 12px;
    color: var(--muted);
  }

  .info-grid {
    display: grid;
    gap: 12px;
  }

  .info-item {
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .info-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .info-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .info-value.active {
    color: var(--green);
  }

  .info-value.expired {
    color: var(--red);
  }

  .session-timer {
    background: rgba(14,165,233,0.1);
    border: 1px solid rgba(14,165,233,0.2);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }

  .timer-label {
    font-size: 11px;
    color: var(--sky-light);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .timer-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
  }

  .btn-logout {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 12px;
    color: #fca5a5;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    width: 100%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-logout:hover {
    background: rgba(239,68,68,0.25);
  }

  .btn-logout svg { width: 16px; height: 16px; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(125,184,212,0.4);
    padding-bottom: 4px;
  }
</style>

$(if refresh-timeout)
<meta http-equiv="refresh" content="$(refresh-timeout-seconds);url=$(link-logout)" />
$(endif)
</head>
<body>
<div class="wrapper">
  <div class="card-status">
    <div class="status-header">
      <div class="status-icon">📶</div>
      <div>
        <div class="status-title">Status Session</div>
        <div class="status-subtitle">Terhubung ke $(hostname)</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Username</span>
        <span class="info-value">$(username)</span>
      </div>
      <div class="info-item">
        <span class="info-label">IP Address</span>
        <span class="info-value">$(ip)</span>
      </div>
      <div class="info-item">
        <span class="info-label">MAC Address</span>
        <span class="info-value">$(mac)</span>
      </div>
      <div class="info-item">
        <span class="info-label">Session Time</span>
        <span class="info-value">$(session-time-left)</span>
      </div>
    </div>

    $(if refresh-timeout)
    <div class="session-timer" style="margin-top: 16px;">
      <div class="timer-label">Sisa Waktu</div>
      <div class="timer-value">$(remaining-time)</div>
    </div>
    $(endif)

    <a class="btn-logout" href="$(link-logout)" style="margin-top: 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Logout
    </a>
  </div>

  <div class="footer">
    Powered by ARIF CELL
  </div>
</div>

<script type="text/javascript">
  document.getElementById('title').innerHTML = window.location.hostname + " > status";
</script>
</body>
</html>
