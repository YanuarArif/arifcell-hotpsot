<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout - ARIF CELL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .logout-container {
      width: 100%;
      max-width: 420px;
    }

    .logout-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      padding: 40px;
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logout-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
      font-size: 40px;
      color: white;
    }

    .logout-card h1 {
      font-size: 1.5rem;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .logout-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-reconnect {
      display: inline-block;
      padding: 14px 30px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-reconnect:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .logout-card {
        padding: 30px 20px;
      }

      .logout-icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }

      .logout-card h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="logout-container">
    <div class="logout-card">
      <div class="logout-icon">👋</div>
      <h1>Logout Berhasil</h1>
      <p>Anda telah keluar dari jaringan WiFi. Terima kasih telah menggunakan layanan kami.</p>
      <a href="$(link-login-only)" class="btn-reconnect">Login Kembali</a>
    </div>
  </div>
</body>
</html>
