<!DOCTYPE html>
<html>
<head>
<title id="title"></title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #0ea5e9;
    --sky-dark: #0284c7;
    --navy: #0c1a2e;
    --navy-card: #1a2f4a;
    --accent: #38bdf8;
    --green: #4ade80;
    --text: #e0f2fe;
    --muted: #7db8d4;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--navy);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(14,165,233,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(56,189,248,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-success {
    background: var(--navy-card);
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
    text-align: center;
  }

  .success-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--green) 0%, #22c55e 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 40px;
    box-shadow: 0 8px 32px rgba(74,222,128,0.3);
  }

  .success-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
  }

  .success-subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .user-badge {
    background: rgba(14,165,233,0.12);
    border: 1px solid rgba(14,165,233,0.25);
    border-radius: 12px;
    padding: 14px 20px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .user-badge-icon {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .user-badge-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .info-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }

  .info-text strong {
    color: var(--text);
    font-weight: 600;
  }

  .btn-status {
    background: linear-gradient(135deg, var(--sky-dark) 0%, var(--sky) 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
    box-shadow: 0 4px 20px rgba(14,165,233,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
  }

  .btn-status:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(14,165,233,0.45);
  }

  .btn-status svg { width: 18px; height: 18px; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(125,184,212,0.4);
    padding-bottom: 4px;
    line-height: 1.8;
  }

  .footer a {
    color: var(--sky);
    text-decoration: none;
    font-weight: 600;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  .footer strong {
    color: var(--accent);
  }
</style>

$(if refresh-timeout)
<script>
  setTimeout(function(){
    window.location.href = './status';
  },4000)
</script>
$(endif)
</head>
<body>
<div class="wrapper">
  <div class="card-success">
    <div class="success-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-title">Selamat!</div>
    <div class="success-subtitle">Anda berhasil terhubung ke internet</div>

$(if login-by == 'trial')
    <div class="user-badge">
      <span class="user-badge-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="user-badge-name">Trial User</span>
    </div>
$(elif login-by != 'mac')
    <div class="user-badge">
      <span class="user-badge-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="user-badge-name" id="user">$(username)</span>
    </div>
$(endif)

    <div class="info-text">
      Perangkat Anda terhubung ke <strong id="dname"></strong>
    </div>

    <a class="btn-status" href="./status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      Check Status
    </a>
  </div>

  <div class="footer">
    Template by <strong>Yanuar Lukman Arif</strong> &bull; 7 Mei 2026<br>
    Didukung oleh <a href="https://nunbisnis.vercel.app/" target="_blank">NunBisnis</a>
  </div>
</div>

<script type="text/javascript">
  document.getElementById('title').innerHTML = window.location.hostname + " > success";
  document.getElementById('dname').innerHTML = window.location.hostname;
</script>
</body>
</html>
