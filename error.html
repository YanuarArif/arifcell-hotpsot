<!DOCTYPE html>
<html>
<head>
<title id="title"></title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="theme-color" content="#ef4444" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #ef4444;
    --red-dark: #dc2626;
    --navy: #0c1a2e;
    --navy-card: #1a2f4a;
    --text: #e0f2fe;
    --muted: #7db8d4;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--navy);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(239,68,68,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(239,68,68,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-error {
    background: var(--navy-card);
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
    text-align: center;
  }

  .error-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 40px;
    box-shadow: 0 8px 32px rgba(239,68,68,0.3);
  }

  .error-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
  }

  .error-message {
    font-size: 14px;
    color: #fca5a5;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .btn-retry {
    background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(239,68,68,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-retry:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(239,68,68,0.45);
  }

  .btn-retry svg { width: 18px; height: 18px; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(125,184,212,0.4);
    padding-bottom: 4px;
    line-height: 1.8;
  }

  .footer a {
    color: var(--sky);
    text-decoration: none;
    font-weight: 600;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  .footer strong {
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card-error">
    <div class="error-icon">⚠️</div>
    <div class="error-title">Terjadi Kesalahan</div>
    <div class="error-message">$(error)</div>
    <a class="btn-retry" href="$(link-login)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Coba Lagi
    </a>
  </div>

  <div class="footer">
    Template by <strong>Yanuar Lukman Arif</strong> &bull; 7 Mei 2026<br>
    Didukung oleh <a href="https://nunbisnis.vercel.app/" target="_blank">NunBisnis</a>
  </div>
</div>

<script type="text/javascript">
  document.getElementById('title').innerHTML = window.location.hostname + " > error";
</script>
</body>
</html>
