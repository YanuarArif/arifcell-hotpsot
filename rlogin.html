<!DOCTYPE html>
<html>
<head>
<title id="title"></title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="theme-color" content="#0ea5e9" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #0ea5e9;
    --sky-dark: #0284c7;
    --sky-light: #bae6fd;
    --navy: #0c1a2e;
    --navy-card: #1a2f4a;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --text: #e0f2fe;
    --muted: #7db8d4;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--navy);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 10%, rgba(14,165,233,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 90%, rgba(56,189,248,0.12) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeUp 0.5s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-message {
    background: var(--navy-card);
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06);
    text-align: center;
  }

  .message-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .message-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .message-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .btn-login {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--sky-dark) 0%, var(--sky) 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    padding: 14px 28px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(14,165,233,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 28px rgba(14,165,233,0.45);
  }

  .btn-login svg { width: 18px; height: 18px; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: rgba(125,184,212,0.4);
    padding-bottom: 4px;
    line-height: 1.8;
  }

  .footer a {
    color: var(--sky);
    text-decoration: none;
    font-weight: 600;
  }

  .footer a:hover {
    text-decoration: underline;
  }

  .footer strong {
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="card-message">
    <div class="message-icon">🔒</div>
    <div class="message-title">Session Habis</div>
    <div class="message-text">
      Masa berlaku akun Anda telah berakhir.<br>
      Silakan login kembali untuk melanjutkan.
    </div>
    <a class="btn-login" href="$(link-login-only)?dst=$(link-orig)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Login Kembali
    </a>
  </div>

  <div class="footer">
    Template by <strong>Yanuar Lukman Arif</strong> &bull; 7 Mei 2026<br>
    Didukung oleh <a href="https://nunbisnis.vercel.app/" target="_blank">NunBisnis</a>
  </div>
</div>

<script type="text/javascript">
  document.getElementById('title').innerHTML = window.location.hostname + " > session expired";
</script>
</body>
</html>
